name: GitHub Action Test

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 4 AM
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Create test artifacts
        run: |
          mkdir -p test-artifacts
          echo "Test content 1" > test-artifacts/test-file-1.txt
          echo "Test content 2" > test-artifacts/test-file-2.txt
          echo '{"test": "data"}' > test-artifacts/test-data.json

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-1
          path: test-artifacts/test-file-1.txt

      - name: Upload more test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-2
          path: test-artifacts/test-file-2.txt

      - name: Upload JSON test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-data
          path: test-artifacts/test-data.json

      - name: Test retain_pipeline_run action
        uses: NovoNordisk-OpenSource/retain_pipeline_run@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify action succeeded
        run: |
          echo "✅ GitHub Action test completed successfully"
          echo "Check the releases page to verify artifacts were retained"

      - name: Clean up old test releases
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🧹 Cleaning up old test releases..."

          # Cross-platform date calculation (works on both GNU date and BSD date)
          if date -v-7d > /dev/null 2>&1; then
              # BSD date (GitHub Actions runners actually use Linux, but keeping for robustness)
              CUTOFF_TIME=$(date -u -v-7d +%Y-%m-%dT%H:%M:%SZ)
          else
              # GNU date (Linux)
              CUTOFF_TIME=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          fi

          echo "Deleting test releases older than: $CUTOFF_TIME"

          # Delete old CI test releases (older than 7 days) to prevent buildup
          gh release list --limit 100 --json tagName,name,createdAt,prerelease | \
          jq -r --arg cutoff "$CUTOFF_TIME" '.[] |
            select(.name | test("CI Test Release|Pipeline Artifacts - Run")) |
            select(.createdAt < $cutoff) |
            .tagName' | \
          while read -r tag; do
            if [ -n "$tag" ]; then
              echo "🗑️ Deleting old test release: $tag"
              gh release delete "$tag" --yes || echo "⚠️ Failed to delete $tag (may already be deleted)"
            fi
          done

          echo "✅ Cleanup completed"