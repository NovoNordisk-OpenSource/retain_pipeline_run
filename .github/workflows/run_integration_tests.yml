name: Integration Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run shell-based integration tests
        run: ./test/integration/run_tests.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Go-based integration tests
        run: go test -C test/integration -v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}